<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Лаба Бібліотека</title>
</head>
<body>
<h1>Бібліотека</h1>

<div>
<button id="btn1" onclick="showTab(1)">Книги</button>
  <button id="btn2" onclick="showTab(2)">Читачі</button>
<button id="btn3" onclick="showTab(3)" >Видачі</button>
<button onclick="clearData()">Скинути всі дані</button>
</div>

<div id="tab1">
<p><button onclick="showForm(1)">Додати</button></p>
<div id="form1" style="display:none">
  <h3>Нова книга</h3>
  <p>Назва: <input type="text" id="bookTitle"></p>
  <p>Автор: <input type="text" id="bookAuthor"></p>
  <p>Жанр:
  <select id="bookGenre">
  <option>Роман</option>
  <option>Повість</option>
  <option>Поезія</option>
  <option>Драма</option>
  <option>Детектив</option>
  <option>Фантастика</option>
  <option>Наукова</option>
  </select></p>
  <p>Рік видання: <input type="number" id="bookYear"></p>
  <p>Сторінок: <input type="number" id="bookPages" min="1"></p>
<p>Примірників: <input type="number" id="bookCopies" min="1"></p>
  <p>Полиця: <input type="text" id="bookShelf"></p>
  <button onclick="addBook()">Зберегти</button> <button onclick="hideForm(1)">Скасувати</button>
</div>
    <table id="table1" border="1" cellpadding="4"></table>
</div>

<div id="tab2">
<p><button onclick="showForm(2)">Додати</button></p>
<div id="form2" style="display:none">
<h3>Новий читач</h3>
<p>ПІБ: <input type="text" id="readerName"></p>
<p>Дата народження: <input type="date" id="readerBirth"></p>
<p>Телефон: <input type="text" id="readerPhone"></p>
<p>Email: <input type="text" id="readerEmail"></p>
<p>Адреса: <input type="text" id="readerAddress"></p>
<p>Дата реєстрації: <input type="date" id="readerRegistered"></p>
<p>Категорія:
<select id="readerCategory">
<option>Студент</option>
<option>Школяр</option>
<option>Викладач</option>
<option>Пенсіонер</option>
<option>Інше</option>
</select></p>
<button onclick="addReader()">Зберегти</button> <button onclick="hideForm(2)">Скасувати</button>
</div>
<table id="table2" border="1" cellpadding="4"></table>
</div>

<div id="tab3">
  <p><button onclick="showForm(3)">Додати</button></p>
  <div id="form3" style="display:none">
    <h3>Нова видача</h3>
    <p>Книга: <select id="loanBook"></select></p>
    <p>Читач: <select id="loanReader"></select></p>
    <p>Дата видачі: <input type="date" id="loanGiven"></p>
    <p>Термін, днів: <input type="number" id="loanDays" min="1" value="14"></p>
    <p>Повернено: <input type="checkbox" id="loanReturned"></p>
    <p>Бібліотекар: <input type="text" id="loanLibrarian"></p>
    <button onclick="addLoan()">Зберегти</button> <button onclick="hideForm(3)">Скасувати</button>
  </div>
  <table id="table3" border="1" cellpadding="4"></table>
  </div>

<script src="script.js"></script>
</body>
</html>
